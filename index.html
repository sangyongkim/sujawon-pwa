<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="수자원기술사">
<title>수자원개발기술사</title>
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface2: #263348;
  --border: #334155;
  --accent: #38bdf8;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #64748b;
  --star: #fbbf24;
  --green: #34d399;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; font-family: -apple-system, 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); }

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100%; }
#topbar {
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  position: sticky; top: 0; z-index: 100;
  flex-shrink: 0;
}
#topbar .back-btn {
  display: none; background: none; border: none; color: var(--accent);
  font-size: 17px; cursor: pointer; padding: 4px 8px 4px 0; white-space: nowrap;
}
#topbar-title { font-size: 17px; font-weight: 600; flex: 1; }
#topbar-sub { font-size: 12px; color: var(--text3); }

#content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

#navbar {
  display: flex; background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: var(--safe-bottom);
  flex-shrink: 0;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 8px 0 6px; background: none; border: none; color: var(--text3);
  font-size: 10px; cursor: pointer; transition: color .2s;
  gap: 3px;
}
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 22px; height: 22px; }

/* ── Views ── */
.view { display: none; padding: 12px 16px; }
.view.active { display: block; }

/* ── Home View ── */
#view-home { padding: 0; }
.home-header {
  padding: calc(16px) 20px 20px;
  text-align: center;
}
.home-header h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
.home-header p { font-size: 14px; color: var(--text3); }
.section-grid { padding: 0 12px 20px; display: flex; flex-direction: column; gap: 10px; }
.section-card {
  background: var(--surface); border-radius: 14px; padding: 16px 16px;
  cursor: pointer; display: flex; align-items: center; gap: 14px;
  border: 1px solid var(--border); border-left-width: 4px;
  transition: background .15s;
}
.section-card:active { background: var(--surface2); }
.section-badge {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 800; flex-shrink: 0;
  letter-spacing: -1px;
}
.section-info { flex: 1; min-width: 0; }
.section-name { font-size: 17px; font-weight: 700; }
.section-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
.chevron { color: var(--text3); flex-shrink: 0; }

/* ── List View ── */
.filter-row {
  display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
}
.chip {
  padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); font-size: 13px;
  cursor: pointer; transition: all .2s;
}
.chip.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

.topic-card {
  background: var(--surface); border-radius: 12px; padding: 14px 16px;
  margin-bottom: 10px; cursor: pointer; display: flex; align-items: center;
  gap: 12px; transition: background .15s; border: 1px solid var(--border);
}
.topic-card:active { background: var(--surface2); }
.topic-num {
  width: 32px; height: 32px; border-radius: 50%; background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: var(--accent); flex-shrink: 0;
}
.topic-info { flex: 1; min-width: 0; }
.topic-title { font-size: 15px; font-weight: 500; line-height: 1.3; }
.topic-meta { font-size: 12px; color: var(--text3); margin-top: 3px; }
.stars { color: var(--star); font-size: 12px; }

/* ── Flash Card View ── */
#view-card { padding: 0; }
.card-header {
  padding: 16px 16px 0;
  display: flex; align-items: flex-start; gap: 10px;
}
.card-topic-num {
  width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #000; flex-shrink: 0;
}
.card-topic-info { flex: 1; }
.card-topic-title { font-size: 16px; font-weight: 700; line-height: 1.3; }
.card-topic-stars { color: var(--star); font-size: 14px; margin-top: 2px; }

.mode-tabs {
  display: flex; margin: 14px 16px 0; background: var(--surface);
  border-radius: 10px; padding: 3px; gap: 2px;
}
.mode-tab {
  flex: 1; padding: 7px; border: none; border-radius: 8px;
  background: none; color: var(--text2); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all .2s;
}
.mode-tab.active { background: var(--accent); color: #000; }

.card-body { padding: 16px; min-height: 300px; }

/* 단답형 */
.short-list { list-style: none; }
.short-list li {
  padding: 10px 12px; margin-bottom: 8px;
  background: var(--surface); border-radius: 10px;
  border-left: 3px solid var(--accent);
  font-size: 14px; line-height: 1.6; color: var(--text);
}
.short-list li strong { color: var(--accent); }
.short-list li code {
  background: var(--surface2); padding: 2px 5px; border-radius: 4px;
  font-size: 13px; color: var(--green);
}

/* 서술형 */
.essay-content { font-size: 14px; line-height: 1.7; }
.essay-content h2 { font-size: 15px; font-weight: 700; color: var(--accent); margin: 16px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
.essay-content h3 { font-size: 14px; font-weight: 700; color: var(--text); margin: 12px 0 6px; }
.essay-content h4 { font-size: 13px; font-weight: 600; color: var(--text2); margin: 10px 0 4px; }
.essay-content p { margin-bottom: 8px; color: var(--text2); }
.essay-content p.label { color: var(--text); font-weight: 600; margin-top: 10px; margin-bottom: 4px; }
.essay-content ul, .essay-content ol { padding-left: 16px; margin-bottom: 8px; color: var(--text2); }
.essay-content li { margin-bottom: 4px; font-size: 13.5px; }
.essay-content strong { color: var(--text); }
.essay-content code { background: var(--surface2); padding: 1px 4px; border-radius: 3px; font-size: 12px; color: var(--green); }
.essay-content .md-table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12.5px; }
.essay-content .md-table th { background: var(--surface2); color: var(--accent); padding: 7px 10px; text-align: left; border: 1px solid var(--border); }
.essay-content .md-table td { padding: 6px 10px; border: 1px solid var(--border); color: var(--text2); vertical-align: top; }
.essay-content .md-table tr:nth-child(even) td { background: rgba(255,255,255,.02); }

.card-nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  background: var(--bg);
  position: sticky; bottom: 0;
}
.card-nav-btn {
  padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text2); font-size: 14px;
  cursor: pointer; font-weight: 600; transition: all .2s;
}
.card-nav-btn:active { background: var(--surface2); }
.card-progress { font-size: 13px; color: var(--text3); }

.detail-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px;
  border: 1px solid var(--accent); background: transparent;
  color: var(--accent); font-size: 13px; cursor: pointer;
}

/* ── Numbers / Laws View ── */
#view-numbers, #view-laws { padding: 16px; }
.section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text); }
.tab-content .md-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.tab-content .md-table th { background: var(--surface2); color: var(--accent); padding: 9px 12px; text-align: left; border: 1px solid var(--border); font-size: 13px; }
.tab-content .md-table td { padding: 8px 12px; border: 1px solid var(--border); color: var(--text2); }
.tab-content .md-table tr:nth-child(even) td { background: rgba(255,255,255,.025); }

/* ── Detail Modal ── */
#modal {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: var(--bg); flex-direction: column;
}
#modal.open { display: flex; }
#modal-topbar {
  padding: calc(var(--safe-top) + 12px) 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; background: var(--bg);
  flex-shrink: 0;
}
#modal-back {
  background: none; border: none; color: var(--accent);
  font-size: 17px; cursor: pointer; display: flex; align-items: center; gap: 4px;
}
#modal-title { font-size: 16px; font-weight: 600; flex: 1; }
#modal-iframe { flex: 1; border: none; background: white; }

/* ── Progress bar ── */
.progress-bar {
  height: 3px; background: var(--surface); margin: 12px 16px 0;
  border-radius: 2px; overflow: hidden;
}
.progress-fill { height: 100%; background: var(--accent); transition: width .3s; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <!-- Top Bar -->
  <div id="topbar">
    <button class="back-btn" id="back-btn" onclick="goBack()">&#8249; <span id="back-label">목록</span></button>
    <div style="flex:1">
      <div id="topbar-title">수자원개발기술사</div>
      <div id="topbar-sub">기술사 암기노트</div>
    </div>
    <button id="home-btn" onclick="goHome()" style="display:none;background:none;border:none;color:var(--text3);padding:4px 0 4px 8px;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </button>
  </div>

  <!-- Content -->
  <div id="content">

    <!-- Home View -->
    <div class="view active" id="view-home">
      <div class="home-header">
        <h1>수자원개발기술사</h1>
        <p>단원을 선택하세요</p>
      </div>
      <div class="section-grid" id="section-grid"></div>
    </div>

    <!-- List View -->
    <div class="view" id="view-list">
      <div class="filter-row">
        <button class="chip active" onclick="filterTopics(0, this)">전체</button>
        <button class="chip" onclick="filterTopics(3, this)">★★★</button>
        <button class="chip" onclick="filterTopics(2, this)">★★</button>
        <button class="chip" onclick="filterTopics(1, this)">★</button>
      </div>
      <div id="topic-list"></div>
    </div>

    <!-- Card View -->
    <div class="view" id="view-card">
      <div class="card-header">
        <div class="card-topic-num" id="card-num">01</div>
        <div class="card-topic-info">
          <div class="card-topic-title" id="card-title">제목</div>
          <div class="card-topic-stars" id="card-stars">★★★</div>
        </div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="card-progress-bar"></div>
      </div>
      <div class="mode-tabs">
        <button class="mode-tab active" id="tab-short" onclick="setMode('short')">단답형</button>
        <button class="mode-tab" id="tab-essay" onclick="setMode('essay')">서술형</button>
      </div>
      <div class="card-body">
        <ul class="short-list" id="card-short"></ul>
        <div class="essay-content" id="card-essay" style="display:none"></div>
      </div>
      <div class="card-nav">
        <button class="card-nav-btn" id="btn-prev" onclick="navigate(-1)">&#9664; 이전</button>
        <span class="card-progress" id="card-progress-text">1 / 27</span>
        <button class="card-nav-btn" id="btn-next" onclick="navigate(1)">다음 &#9654;</button>
      </div>
      <div style="padding:0 16px 16px; display:flex; gap:8px; justify-content:center">
        <button class="detail-btn" onclick="openDetail()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          상세노트 보기
        </button>
      </div>
    </div>

    <!-- Numbers View -->
    <div class="view" id="view-numbers">
      <div class="section-title">핵심 수치 총정리</div>
      <div class="tab-content" id="numbers-content"></div>
    </div>

    <!-- Laws View -->
    <div class="view" id="view-laws">
      <div class="section-title">법규 조문 정리</div>
      <div class="tab-content" id="laws-content"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav id="navbar" style="display:none">
    <button class="nav-btn active" id="nav-list" onclick="showView('list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      목록
    </button>
    <button class="nav-btn" id="nav-numbers" onclick="showView('numbers')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      핵심수치
    </button>
    <button class="nav-btn" id="nav-laws" onclick="showView('laws')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      법규
    </button>
  </nav>
</div>

<!-- Detail Modal -->
<div id="modal">
  <div id="modal-topbar">
    <button id="modal-back" onclick="closeDetail()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      닫기
    </button>
    <span id="modal-title"></span>
  </div>
  <iframe id="modal-iframe" sandbox="allow-same-origin allow-scripts"></iframe>
</div>

<script src="data_하천계획.js"></script>
<script src="data_방재.js"></script>
<script src="data_하천공학.js"></script>
<script src="data_수문학.js"></script>
<script src="data_댐.js"></script>
<script>
// ── Section Config ──
const SECTION_CONFIG = [
  { name: '하천계획', color: '#38bdf8', abbr: '하천\n계획', folder: '하천계획' },
  { name: '방재',     color: '#f97316', abbr: '방재',       folder: '방재' },
  { name: '하천공학', color: '#4ade80', abbr: '하천\n공학', folder: '하천공학' },
  { name: '수문학',   color: '#a78bfa', abbr: '수문\n학',   folder: '수문학' },
  { name: '댐',       color: '#fb7185', abbr: '댐',         folder: '댐' },
];

// ── State ──
let currentView = 'home';
let currentSection = null;   // SECTION_CONFIG entry
let currentSectionData = null; // { topics, numbersHtml, lawsHtml }
let filteredTopics = [];
let currentTopic = 0;
let currentMode = 'short';
let filterStar = 0;

// ── Init ──
function init() {
  renderHome();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

// ── Home ──
function renderHome() {
  const el = document.getElementById('section-grid');
  el.innerHTML = SECTION_CONFIG.map(s => {
    const data = window.SECTION_DATA && window.SECTION_DATA[s.name];
    const count = data ? data.topics.length : '?';
    const abbrLines = s.abbr.split('\n');
    const abbrHtml = abbrLines.length > 1
      ? `<span style="font-size:11px;line-height:1.1">${abbrLines.join('<br>')}</span>`
      : `<span>${s.abbr}</span>`;
    return `
      <div class="section-card" onclick="selectSection('${s.name}')"
           style="border-left-color:${s.color}">
        <div class="section-badge"
             style="background:${s.color}22;color:${s.color};text-align:center">
          ${abbrHtml}
        </div>
        <div class="section-info">
          <div class="section-name" style="color:${s.color}">${s.name}</div>
          <div class="section-meta">토픽 ${count}개</div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </div>`;
  }).join('');
}

function selectSection(name) {
  currentSection = SECTION_CONFIG.find(s => s.name === name);
  currentSectionData = window.SECTION_DATA[name];
  filterStar = 0;
  filteredTopics = currentSectionData.topics;
  document.getElementById('numbers-content').innerHTML = currentSectionData.numbersHtml || '<p style="color:var(--text3)">내용 없음</p>';
  document.getElementById('laws-content').innerHTML = currentSectionData.lawsHtml || '<p style="color:var(--text3)">내용 없음</p>';
  renderList();
  showView('list');
}

// ── List ──
function renderList() {
  filteredTopics = filterStar === 0
    ? currentSectionData.topics
    : currentSectionData.topics.filter(t => t.stars === filterStar);

  document.getElementById('topic-list').innerHTML = filteredTopics.map((t, i) => `
    <div class="topic-card" onclick="openCard(${i})">
      <div class="topic-num">${String(t.id).padStart(2,'0')}</div>
      <div class="topic-info">
        <div class="topic-title">${t.title}</div>
        <div class="topic-meta">
          <span class="stars">${'★'.repeat(t.stars)}${'☆'.repeat(Math.max(0, 3-t.stars))}</span>
          &nbsp;·&nbsp; 단답형 ${t.bullets.length}항목
        </div>
      </div>
      <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </div>`).join('');
}

function filterTopics(stars, btn) {
  filterStar = stars;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

// ── Card ──
function openCard(filteredIdx) {
  currentTopic = filteredIdx;
  currentMode = 'short';
  renderCard();
  showView('card');
}

function renderCard() {
  const t = filteredTopics[currentTopic];
  if (!t) return;

  document.getElementById('card-num').textContent = String(t.id).padStart(2,'0');
  document.getElementById('card-title').textContent = t.title;
  document.getElementById('card-stars').textContent = '★'.repeat(t.stars) + '☆'.repeat(Math.max(0, 3-t.stars));

  const pct = ((currentTopic + 1) / filteredTopics.length) * 100;
  document.getElementById('card-progress-bar').style.width = pct + '%';
  document.getElementById('card-progress-text').textContent =
    `${currentTopic + 1} / ${filteredTopics.length}`;

  document.getElementById('btn-prev').disabled = currentTopic === 0;
  document.getElementById('btn-next').disabled = currentTopic === filteredTopics.length - 1;

  renderCardContent();
}

function renderCardContent() {
  const t = filteredTopics[currentTopic];

  function fmt(s) {
    return s
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`(.+?)`/g, '<code>$1</code>');
  }

  const shortEl = document.getElementById('card-short');
  const essayEl = document.getElementById('card-essay');

  if (currentMode === 'short') {
    shortEl.style.display = '';
    essayEl.style.display = 'none';
    shortEl.innerHTML = t.bullets.length
      ? t.bullets.map(b => `<li>${fmt(b)}</li>`).join('')
      : '<li style="color:var(--text3)">단답형 내용 없음</li>';
  } else {
    shortEl.style.display = 'none';
    essayEl.style.display = '';
    essayEl.innerHTML = t.essay || '<p style="color:var(--text3)">서술형 내용 없음</p>';
  }

  document.getElementById('tab-short').classList.toggle('active', currentMode === 'short');
  document.getElementById('tab-essay').classList.toggle('active', currentMode === 'essay');
}

function setMode(mode) {
  currentMode = mode;
  renderCardContent();
}

function navigate(dir) {
  const next = currentTopic + dir;
  if (next >= 0 && next < filteredTopics.length) {
    currentTopic = next;
    currentMode = 'short';
    renderCard();
    document.getElementById('content').scrollTop = 0;
  }
}

// ── Detail Modal ──
function openDetail() {
  const t = filteredTopics[currentTopic];
  if (!t || !t.file) {
    alert('상세노트 파일이 없습니다.');
    return;
  }
  const src = currentSection.folder + '/' + t.file;
  document.getElementById('modal-title').textContent = t.title;
  document.getElementById('modal-iframe').src = src;
  document.getElementById('modal').classList.add('open');
}

function closeDetail() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal-iframe').src = '';
}

// ── View switching ──
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('view-' + name).classList.add('active');

  const navbar = document.getElementById('navbar');
  const backBtn = document.getElementById('back-btn');
  const backLabel = document.getElementById('back-label');
  const topbarTitle = document.getElementById('topbar-title');
  const topbarSub = document.getElementById('topbar-sub');

  const homeBtn = document.getElementById('home-btn');
  if (name === 'home') {
    navbar.style.display = 'none';
    backBtn.style.display = 'none';
    homeBtn.style.display = 'none';
    topbarTitle.textContent = '수자원개발기술사';
    topbarSub.textContent = '기술사 암기노트';
  } else if (name === 'card') {
    navbar.style.display = 'none';
    backBtn.style.display = '';
    homeBtn.style.display = 'block';
    backLabel.textContent = '목록';
    topbarTitle.textContent = '암기카드';
    topbarSub.textContent = currentSection ? currentSection.name : '';
  } else {
    navbar.style.display = 'flex';
    backBtn.style.display = '';
    homeBtn.style.display = 'none';
    backLabel.textContent = '홈';
    topbarTitle.textContent = currentSection ? currentSection.name : '';
    topbarSub.textContent = '수자원개발기술사';
    if (name === 'list')    document.getElementById('nav-list').classList.add('active');
    if (name === 'numbers') document.getElementById('nav-numbers').classList.add('active');
    if (name === 'laws')    document.getElementById('nav-laws').classList.add('active');
  }

  currentView = name;
  document.getElementById('content').scrollTop = 0;
}

function goBack() {
  if (currentView === 'card') {
    showView('list');
  } else {
    goHome();
  }
}

function goHome() {
  currentSection = null;
  currentSectionData = null;
  showView('home');
}

// ── Touch swipe for card navigation ──
let touchStartX = 0;
document.getElementById('view-card').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });
document.getElementById('view-card').addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 60) navigate(dx < 0 ? 1 : -1);
}, { passive: true });

init();
</script>
</body>
